name: ClearspaceMobile
options:
  bundleIdPrefix: to.clearspace
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: W4Y8D5GH62    # Clearspace Offices Inc.
    CODE_SIGN_STYLE: Automatic

targets:
  ClearspaceMobile:
    type: application
    platform: iOS
    sources:
      - ClearspaceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.clearspace.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # placeholder wordmark icon; replace with final design
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ClearspaceMobile/Info.plist
      properties:
        CFBundleDisplayName: Clearspace
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: to.clearspace.mobile.auth
            CFBundleURLSchemes: [clearspacemobile]
        ITSAppUsesNonExemptEncryption: false

  ClearspaceMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ClearspaceMobileUITests
    dependencies:
      - target: ClearspaceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.clearspace.mobile.uitests

  ClearspaceMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClearspaceMobileTests
    dependencies:
      - target: ClearspaceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.clearspace.mobile.tests

schemes:
  ClearspaceMobile:
    build:
      targets:
        ClearspaceMobile: all
        ClearspaceMobileUITests: [test]
        ClearspaceMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearspaceMobileTests
        - ClearspaceMobileUITests
