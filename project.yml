name: ClearspaceMobile
options:
  bundleIdPrefix: to.clearspace
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set once Apple Developer account is connected
    CODE_SIGN_STYLE: Automatic

targets:
  ClearspaceMobile:
    type: application
    platform: iOS
    sources:
      - ClearspaceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.clearspace.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: ""   # no app icon yet — added before TestFlight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Clearspace
    info:
      path: ClearspaceMobile/Info.plist
      properties:
        CFBundleDisplayName: Clearspace
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: to.clearspace.mobile.auth
            CFBundleURLSchemes: [clearspacemobile]
        ITSAppUsesNonExemptEncryption: false

  ClearspaceMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ClearspaceMobileUITests
    dependencies:
      - target: ClearspaceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.clearspace.mobile.uitests

  ClearspaceMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClearspaceMobileTests
    dependencies:
      - target: ClearspaceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.clearspace.mobile.tests

schemes:
  ClearspaceMobile:
    build:
      targets:
        ClearspaceMobile: all
        ClearspaceMobileUITests: [test]
        ClearspaceMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearspaceMobileTests
        - ClearspaceMobileUITests
